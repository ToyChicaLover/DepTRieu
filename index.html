<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Pronunciation Pro</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #d93025;
            font-size: 24px;
        }
        .progress-indicator {
            text-align: center;
            font-weight: bold;
            color: #64748b;
            margin-bottom: 20px;
            font-size: 16px;
            padding: 5px 15px;
            background: #f1f5f9;
            border-radius: 20px;
            display: inline-block;
        }
        .text-center { text-align: center; }
        
        .target-box {
            background: #e2e8f0;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }
        .chinese-text {
            font-size: 36px;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }
        .pinyin-text {
            font-size: 18px;
            color: #475569;
            font-style: italic;
        }
        .meaning-text {
            font-size: 16px;
            color: #0f172a;
            margin-top: 10px;
            font-weight: 500;
        }
        .controls {
            text-align: center;
        }
        button {
            background-color: #d93025;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: background 0.3s ease;
            box-shadow: 0 2px 4px rgba(217, 48, 37, 0.4);
        }
        button:hover {
            background-color: #b31412;
        }
        button:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
            box-shadow: none;
        }
        button.listening {
            background-color: #fbbc04;
            color: #000;
            animation: pulse 1.5s infinite;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        .score {
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
        }
        .spoken-text {
            font-size: 18px;
            color: #475569;
            text-align: center;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .feedback-good { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .feedback-average { background-color: #fef08a; color: #854d0e; border: 1px solid #fde047; }
        .feedback-poor { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    </style>
</head>
<body>
<H1>Quách Thanh Triều</H1>

<div class="container">
    <h1>Chấm Điểm Phát Âm (Nâng Cao)</h1>
    
    <div class="text-center">
        <div class="progress-indicator" id="progressIndicator">Từ vựng: 1 / 5</div>
    </div>

    <div class="target-box" id="targetBox">
        <div class="chinese-text" id="targetText">爸爸</div>
        <div class="pinyin-text" id="pinyinText">Bàba</div>
        <div class="meaning-text" id="meaningText">Bố / Cha</div>
    </div>

    <div class="controls">
        <button id="micBtn" onclick="startSpeaking()">🎤 Bắt đầu đọc</button>
        <p id="statusText" style="font-size: 14px; color: #64748b; margin-top: 10px;">Nhấn nút và cho phép micro để bắt đầu.</p>
    </div>

    <div id="resultArea" class="result-box">
        <div class="score" id="scoreDisplay">0%</div>
        <div class="spoken-text" id="spokenDisplay"></div>
        <p style="text-align: center; margin-top: 10px; font-weight: bold;" id="feedbackText"></p>
    </div>
</div>

<script>
    // Kho từ vựng giới hạn 5 từ
    const vocabBank = [
        { text: "爸爸", pinyin: "Bàba", meaning: "Bố / Cha" },
        { text: "现在", pinyin: "Xiànzài", meaning: "Bây giờ" },
        { text: "是谁", pinyin: "Shì shéi", meaning: "Là ai?" },
        { text: "修仙", pinyin: "Xiūxiān", meaning: "Tu tiên" },
        { text: "剑法", pinyin: "Jiànfǎ", meaning: "Kiếm pháp" }
    ];

    let currentIndex = 0;
    
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'zh-CN'; 
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;
    } else {
        alert("Trình duyệt không hỗ trợ Web Speech API. Vui lòng dùng Chrome.");
    }

    const targetElement = document.getElementById('targetText');
    const pinyinElement = document.getElementById('pinyinText');
    const meaningElement = document.getElementById('meaningText');
    const progressIndicator = document.getElementById('progressIndicator');
    
    const micBtn = document.getElementById('micBtn');
    const statusText = document.getElementById('statusText');
    const resultArea = document.getElementById('resultArea');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const spokenDisplay = document.getElementById('spokenDisplay');
    const feedbackText = document.getElementById('feedbackText');

    function loadCurrentVocab() {
        targetElement.innerText = vocabBank[currentIndex].text;
        pinyinElement.innerText = vocabBank[currentIndex].pinyin;
        meaningElement.innerText = vocabBank[currentIndex].meaning;
        progressIndicator.innerText = `Từ vựng: ${currentIndex + 1} / ${vocabBank.length}`;
        
        resultArea.style.display = 'none';
        statusText.innerText = "Sẵn sàng. Hãy nhấn nút để đọc.";
    }

    window.onload = loadCurrentVocab;

    function startSpeaking() {
        if (!recognition) return;

        recognition.start();
        micBtn.classList.add('listening');
        micBtn.innerText = "Đang nghe...";
        statusText.innerText = "Hãy đọc to từ trên.";
        resultArea.style.display = 'none';

        recognition.onspeechend = function() {
            recognition.stop();
            micBtn.classList.remove('listening');
            micBtn.innerText = "🎤 Bắt đầu đọc";
            statusText.innerText = "Đang phân tích phổ giọng...";
        }

        recognition.onresult = function(event) {
            const spokenSentence = event.results[0][0].transcript;
            const confidence = event.results[0][0].confidence; // Lấy độ tự tin của AI (0.0 đến 1.0)
            const targetSentence = targetElement.innerText;
            
            evaluatePronunciation(targetSentence, spokenSentence, confidence);
        }

        recognition.onerror = function(event) {
            micBtn.classList.remove('listening');
            micBtn.innerText = "🎤 Bắt đầu đọc";
            statusText.innerText = "Lỗi: " + event.error + " (Kiểm tra lại micro)";
        }
    }

    // Thuật toán đo khoảng cách Levenshtein
    function levenshteinDistance(a, b) {
        if (a.length === 0) return b.length;
        if (b.length === 0) return a.length;
        const matrix = [];
        for (let i = 0; i <= b.length; i++) matrix[i] = [i];
        for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
        for (let i = 1; i <= b.length; i++) {
            for (let j = 1; j <= a.length; j++) {
                if (b.charAt(i - 1) === a.charAt(j - 1)) {
                    matrix[i][j] = matrix[i - 1][j - 1];
                } else {
                    matrix[i][j] = Math.min(
                        matrix[i - 1][j - 1] + 1,
                        Math.min(matrix[i][j - 1] + 1, matrix[i - 1][j] + 1)
                    );
                }
            }
        }
        return matrix[b.length][a.length];
    }

    // Hàm đánh giá phát âm thông minh
    function evaluatePronunciation(target, spoken, confidence) {
        const cleanTarget = target.replace(/[.,!?。，！？、\s]/g, '');
        const cleanSpoken = spoken.replace(/[.,!?。，！？、\s]/g, '');

        // 1. Tính toán độ giống nhau về mặt văn bản
        const distance = levenshteinDistance(cleanTarget, cleanSpoken);
        const maxLen = Math.max(cleanTarget.length, cleanSpoken.length);
        const textSimilarity = maxLen === 0 ? 100 : ((maxLen - distance) / maxLen) * 100;

        // 2. Nội suy điểm số dựa trên AI Confidence
        let finalScore = 0;
        const confPercent = confidence * 100;

        if (textSimilarity === 100) {
            // Đọc đúng chữ, dao động điểm từ 85 - 100 dựa trên độ rõ ràng
            finalScore = 85 + (confidence * 15);
        } else if (textSimilarity > 0) {
            // Đọc đúng một phần (vd: đúng 1 chữ trong từ 2 chữ)
            finalScore = (textSimilarity * 0.6) + (confPercent * 0.4);
        } else {
            // Đọc sai hoàn toàn thanh điệu dẫn đến chữ khác, nhưng AI vẫn nghe thấy âm thanh
            // Thưởng một ít điểm nỗ lực dựa trên độ rõ của âm
            finalScore = confPercent * 0.35; 
        }

        // Đảm bảo điểm luôn nằm trong khoảng 0 - 100
        finalScore = Math.min(100, Math.max(0, Math.round(finalScore)));
        
        displayResults(finalScore, spoken);
    }

    function displayResults(score, spoken) {
        resultArea.style.display = 'block';
        scoreDisplay.innerText = `Điểm: ${score}/100`;
        spokenDisplay.innerText = `Phân tích nhận diện: "${spoken}"`;
        resultArea.className = 'result-box'; 

        if (score >= 85) {
            resultArea.classList.add('feedback-good');
            
            if (currentIndex < vocabBank.length - 1) {
                feedbackText.innerText = "Chính xác (很好)! Đang tự động chuyển từ sau 2 giây...";
                micBtn.disabled = true; 
                
                setTimeout(() => {
                    currentIndex++;
                    loadCurrentVocab();
                    micBtn.disabled = false;
                }, 2000);
                
            } else {
                feedbackText.innerText = "Xuất sắc! Bạn đã vượt qua tất cả các từ.";
            }
            
        } else if (score >= 50) {
            resultArea.classList.add('feedback-average');
            feedbackText.innerText = "Bạn có âm đúng nhưng chưa rõ hoặc sai thanh điệu. Đọc lại để đạt >85 điểm nhé.";
        } else {
            resultArea.classList.add('feedback-poor');
            feedbackText.innerText = "Phát âm chưa chuẩn (加油). Chú ý thanh điệu và đọc chậm lại.";
        }
    }
</script>

</body>
</html>
