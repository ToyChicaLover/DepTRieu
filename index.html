<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Pronunciation Auto-Advance</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #d93025;
            font-size: 24px;
        }
        .progress-indicator {
            text-align: center;
            font-weight: bold;
            color: #64748b;
            margin-bottom: 20px;
            font-size: 16px;
            padding: 5px 15px;
            background: #f1f5f9;
            border-radius: 20px;
            display: inline-block;
        }
        .text-center { text-align: center; }
        
        .target-box {
            background: #e2e8f0;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
            transition: opacity 0.3s ease;
        }
        .chinese-text {
            font-size: 36px;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }
        .pinyin-text {
            font-size: 18px;
            color: #475569;
            font-style: italic;
        }
        .meaning-text {
            font-size: 16px;
            color: #0f172a;
            margin-top: 10px;
            font-weight: 500;
        }
        .controls {
            text-align: center;
        }
        button {
            background-color: #d93025;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: background 0.3s ease;
            box-shadow: 0 2px 4px rgba(217, 48, 37, 0.4);
        }
        button:hover {
            background-color: #b31412;
        }
        button.listening {
            background-color: #fbbc04;
            color: #000;
            animation: pulse 1.5s infinite;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        .score {
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
        }
        .spoken-text {
            font-size: 20px;
            color: #475569;
            text-align: center;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .feedback-good { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .feedback-average { background-color: #fef08a; color: #854d0e; border: 1px solid #fde047; }
        .feedback-poor { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    </style>
</head>
<body>

<div class="container">
    <h1>Luyện Phát Âm Tiếng Trung</h1>
    
    <div class="text-center">
        <div class="progress-indicator" id="progressIndicator">Từ vựng: 1 / 5</div>
    </div>

    <div class="target-box" id="targetBox">
        <div class="chinese-text" id="targetText">爸爸</div>
        <div class="pinyin-text" id="pinyinText">Bàba</div>
        <div class="meaning-text" id="meaningText">Bố / Cha</div>
    </div>

    <div class="controls">
        <button id="micBtn" onclick="startSpeaking()">🎤 Bắt đầu đọc</button>
        <p id="statusText" style="font-size: 14px; color: #64748b; margin-top: 10px;">Nhấn nút và cho phép micro để bắt đầu.</p>
    </div>

    <div id="resultArea" class="result-box">
        <div class="score" id="scoreDisplay">0%</div>
        <div class="spoken-text" id="spokenDisplay"></div>
        <p style="text-align: center; margin-top: 10px; font-weight: bold;" id="feedbackText"></p>
    </div>
</div>

<script>
    // Kho từ vựng giới hạn 5 từ
    const vocabBank = [
        { text: "爸爸", pinyin: "Bàba", meaning: "Bố / Cha" },
        { text: "现在", pinyin: "Xiànzài", meaning: "Bây giờ" },
        { text: "是谁", pinyin: "Shì shéi", meaning: "Là ai?" },
        { text: "修仙", pinyin: "Xiūxiān", meaning: "Tu tiên" },
        { text: "剑法", pinyin: "Jiànfǎ", meaning: "Kiếm pháp" }
    ];

    let currentIndex = 0;
    
    // Khởi tạo Web Speech API
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'zh-CN'; 
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;
    } else {
        alert("Trình duyệt không hỗ trợ Web Speech API. Vui lòng dùng Chrome.");
    }

    const targetElement = document.getElementById('targetText');
    const pinyinElement = document.getElementById('pinyinText');
    const meaningElement = document.getElementById('meaningText');
    const progressIndicator = document.getElementById('progressIndicator');
    
    const micBtn = document.getElementById('micBtn');
    const statusText = document.getElementById('statusText');
    const resultArea = document.getElementById('resultArea');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const spokenDisplay = document.getElementById('spokenDisplay');
    const feedbackText = document.getElementById('feedbackText');

    // Hàm tải dữ liệu từ vựng lên giao diện
    function loadCurrentVocab() {
        targetElement.innerText = vocabBank[currentIndex].text;
        pinyinElement.innerText = vocabBank[currentIndex].pinyin;
        meaningElement.innerText = vocabBank[currentIndex].meaning;
        progressIndicator.innerText = `Từ vựng: ${currentIndex + 1} / ${vocabBank.length}`;
        
        // Reset kết quả
        resultArea.style.display = 'none';
        statusText.innerText = "Sẵn sàng. Hãy nhấn nút để đọc.";
    }

    // Khởi động từ vựng đầu tiên khi mở web
    window.onload = loadCurrentVocab;

    function startSpeaking() {
        if (!recognition) return;

        recognition.start();
        micBtn.classList.add('listening');
        micBtn.innerText = "Đang nghe...";
        statusText.innerText = "Hệ thống đang nghe... Hãy đọc to từ trên.";
        resultArea.style.display = 'none';

        recognition.onspeechend = function() {
            recognition.stop();
            micBtn.classList.remove('listening');
            micBtn.innerText = "🎤 Bắt đầu đọc";
            statusText.innerText = "Đang xử lý dữ liệu...";
        }

        recognition.onresult = function(event) {
            const spokenSentence = event.results[0][0].transcript;
            const targetSentence = targetElement.innerText;
            evaluatePronunciation(targetSentence, spokenSentence);
        }

        recognition.onerror = function(event) {
            micBtn.classList.remove('listening');
            micBtn.innerText = "🎤 Bắt đầu đọc";
            statusText.innerText = "Lỗi micro: " + event.error;
        }
    }

    function evaluatePronunciation(target, spoken) {
        const punctuationRegex = /[.,!?。，！？、\s]/g;
        const cleanTarget = target.replace(punctuationRegex, '').split('');
        const cleanSpoken = spoken.replace(punctuationRegex, '').split('');

        let matchCount = 0;
        
        cleanTarget.forEach(char => {
            const index = cleanSpoken.indexOf(char);
            if (index !== -1) {
                matchCount++;
                cleanSpoken.splice(index, 1);
            }
        });

        const score = Math.round((matchCount / cleanTarget.length) * 100);
        displayResults(score, spoken);
    }

    function displayResults(score, spoken) {
        resultArea.style.display = 'block';
        scoreDisplay.innerText = `Độ chính xác: ${score}%`;
        spokenDisplay.innerText = `Nghe được: "${spoken}"`;
        resultArea.className = 'result-box'; 

        if (score >= 90) {
            resultArea.classList.add('feedback-good');
            
            // Xử lý cơ chế tự động chuyển bài
            if (currentIndex < vocabBank.length - 1) {
                feedbackText.innerText = "Chính xác (很好)! Đang tự động chuyển từ sau 2.5 giây...";
                micBtn.disabled = true; // Khóa nút bấm tạm thời
                
                setTimeout(() => {
                    currentIndex++;
                    loadCurrentVocab();
                    micBtn.disabled = false;
                }, 2500);
                
            } else {
                feedbackText.innerText = "Tuyệt vời! Bạn đã hoàn thành toàn bộ kho từ vựng.";
            }
            
        } else if (score >= 60) {
            resultArea.classList.add('feedback-average');
            feedbackText.innerText = "Khá tốt! Hãy chú ý hơn vào các thanh điệu (dấu). Đọc lại để qua bài nhé.";
        } else {
            resultArea.classList.add('feedback-poor');
            feedbackText.innerText = "Cố gắng lên (加油)! Hãy đọc chậm lại và nhấn rõ âm pinyin.";
        }
    }
</script>

</body>
</html>
