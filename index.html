<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Pronunciation Practice</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #d93025; /* Đổi sang tông đỏ cho phù hợp chủ đề tiếng Trung */
            font-size: 24px;
        }
        .exercise-selector {
            margin-bottom: 20px;
        }
        select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            font-size: 16px;
        }
        .target-box {
            background: #e2e8f0;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }
        .chinese-text {
            font-size: 28px;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 5px;
        }
        .pinyin-text {
            font-size: 18px;
            color: #475569;
            font-style: italic;
        }
        .controls {
            text-align: center;
        }
        button {
            background-color: #d93025;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 50px;
            cursor: pointer;
            transition: background 0.3s ease;
            box-shadow: 0 2px 4px rgba(217, 48, 37, 0.4);
        }
        button:hover {
            background-color: #b31412;
        }
        button.listening {
            background-color: #fbbc04;
            color: #000;
            animation: pulse 1.5s infinite;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        .score {
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
        }
        .spoken-text {
            font-size: 20px;
            color: #475569;
            text-align: center;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .feedback-good { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .feedback-average { background-color: #fef08a; color: #854d0e; border: 1px solid #fde047; }
        .feedback-poor { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    </style>
</head>
<body>

<div class="container">
    <h1>Luyện Phát Âm Tiếng Trung (Giản Thể)</h1>
    
    <div class="exercise-selector">
        <label for="lesson">Chọn bài tập:</label>
        <select id="lesson" onchange="changeLesson()">
            <option value="爸爸，现在几点了？" data-pinyin="Bàba, xiànzài jǐ diǎn le?">Bài 1: Giao tiếp & Gia đình (Bàba, xiànzài jǐ diǎn le?)</option>
            <option value="那个男孩是谁？" data-pinyin="Nà gè nán hái shì shéi?">Bài 2: Giao tiếp cơ bản (Nà gè nán hái shì shéi?)</option>
            <option value="我喜欢看仙侠小说。" data-pinyin="Wǒ xǐhuān kàn xiānxiá xiǎoshuō.">Bài 3: Sở thích cá nhân (Wǒ xǐhuān kàn xiānxiá xiǎoshuō.)</option>
        </select>
    </div>

    <div class="target-box">
        <div class="chinese-text" id="targetText">爸爸，现在几点了？</div>
        <div class="pinyin-text" id="pinyinText">Bàba, xiànzài jǐ diǎn le?</div>
    </div>

    <div class="controls">
        <button id="micBtn" onclick="startSpeaking()">🎤 Bắt đầu đọc</button>
        <p id="statusText" style="font-size: 14px; color: #64748b; margin-top: 10px;">Nhấn nút và cho phép micro để bắt đầu.</p>
    </div>

    <div id="resultArea" class="result-box">
        <div class="score" id="scoreDisplay">0%</div>
        <div class="spoken-text" id="spokenDisplay"></div>
        <p style="text-align: center; margin-top: 10px; font-weight: bold;" id="feedbackText"></p>
    </div>
</div>

<script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        // Thiết lập chuẩn tiếng Trung Quốc (Giản thể)
        recognition.lang = 'zh-CN'; 
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;
    } else {
        alert("Trình duyệt của bạn không hỗ trợ Web Speech API. Vui lòng sử dụng Google Chrome.");
    }

    const targetElement = document.getElementById('targetText');
    const pinyinElement = document.getElementById('pinyinText');
    const micBtn = document.getElementById('micBtn');
    const statusText = document.getElementById('statusText');
    const resultArea = document.getElementById('resultArea');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const spokenDisplay = document.getElementById('spokenDisplay');
    const feedbackText = document.getElementById('feedbackText');

    function changeLesson() {
        const lessonSelect = document.getElementById('lesson');
        const selectedOption = lessonSelect.options[lessonSelect.selectedIndex];
        
        targetElement.innerText = selectedOption.value;
        pinyinElement.innerText = selectedOption.getAttribute('data-pinyin');
        resultArea.style.display = 'none';
    }

    function startSpeaking() {
        if (!recognition) return;

        recognition.start();
        micBtn.classList.add('listening');
        micBtn.innerText = "Đang nghe...";
        statusText.innerText = "Hệ thống đang nghe... Hãy đọc to câu trên.";
        resultArea.style.display = 'none';

        recognition.onspeechend = function() {
            recognition.stop();
            micBtn.classList.remove('listening');
            micBtn.innerText = "🎤 Bắt đầu đọc";
            statusText.innerText = "Đang xử lý dữ liệu...";
        }

        recognition.onresult = function(event) {
            const spokenSentence = event.results[0][0].transcript;
            const targetSentence = targetElement.innerText;
            evaluatePronunciation(targetSentence, spokenSentence);
        }

        recognition.onerror = function(event) {
            micBtn.classList.remove('listening');
            micBtn.innerText = "🎤 Bắt đầu đọc";
            statusText.innerText = "Lỗi micro: " + event.error;
        }
    }

    function evaluatePronunciation(target, spoken) {
        // Loại bỏ các dấu câu phổ biến của tiếng Trung và tiếng Anh, không có khoảng trắng
        const punctuationRegex = /[.,!?。，！？、\s]/g;
        const cleanTarget = target.replace(punctuationRegex, '').split('');
        const cleanSpoken = spoken.replace(punctuationRegex, '').split('');

        let matchCount = 0;
        
        // So sánh từng chữ Hán
        cleanTarget.forEach(char => {
            const index = cleanSpoken.indexOf(char);
            if (index !== -1) {
                matchCount++;
                cleanSpoken.splice(index, 1);
            }
        });

        const score = Math.round((matchCount / cleanTarget.length) * 100);
        displayResults(score, spoken);
    }

    function displayResults(score, spoken) {
        resultArea.style.display = 'block';
        scoreDisplay.innerText = `Độ chính xác: ${score}%`;
        spokenDisplay.innerText = `Hệ thống nghe được: "${spoken}"`;
        statusText.innerText = "Hoàn tất!";

        resultArea.className = 'result-box'; 

        if (score >= 90) {
            resultArea.classList.add('feedback-good');
            feedbackText.innerText = "Rất tốt (很好)! Thanh điệu của bạn rất chuẩn xác.";
        } else if (score >= 60) {
            resultArea.classList.add('feedback-average');
            feedbackText.innerText = "Khá tốt! Hãy chú ý hơn vào các thanh điệu (dấu) để hệ thống nhận diện đúng chữ Hán.";
        } else {
            resultArea.classList.add('feedback-poor');
            feedbackText.innerText = "Cố gắng lên (加油)! Hãy đọc chậm lại và nhấn rõ âm pinyin.";
        }
    }
</script>

</body>
</html>
